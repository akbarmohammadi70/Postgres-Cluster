---
- name: Update and upgrade apt packages
  become: true
  apt:
    upgrade: yes
    update_cache: yes
    cache_valid_time: 86400
  ignore_errors: true

- name: Install required system packages
  apt:
    pkg:
      - curl 
      - ca-certificates 
      - python3-pip 
      - python3-setuptools 
      - python3-psycopg2 
      - iptables-persistent
    state: present

- name: Set iptables rules
  iptables:
    table: "{{ item.table }}"
    chain: "{{ item.chain }}"
    protocol: "{{ item.protocol }}"
    destination_port: "{{ item.destination_port }}"
    action: "{{ item.action }}"
    jump: "{{ item.jump }}"
  with_items:
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '22',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'udp',
      destination_port: '53',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '5432',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '2380',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '2379',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '8008',
      action: 'insert',
      jump: 'ACCEPT'
    }

- name: Allow established connections
  iptables:
    table: filter
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    action: insert
    jump: ACCEPT

- name: Drop all other traffic
  iptables:
    table: filter
    chain: INPUT
    action: append
    jump: DROP

- name: Save iptables rules
  shell: iptables-save > /etc/iptables/rules.v4

- name: Load nf_conntrack kernel module
  become: true
  community.general.modprobe:
    name: nf_conntrack
    state: present

- name: Ensure nf_conntrack loads at boot
  become: true
  ansible.builtin.lineinfile:
    path: /etc/modules
    regexp: '^nf_conntrack$'
    line: 'nf_conntrack'
    state: present
    create: true

- name: Configure kernel parameters for PostgreSQL and Patroni
  become: true
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    # --------------------------------------------------------
    # Memory
    # --------------------------------------------------------
    - { key: "vm.swappiness", value: "1" }
    - { key: "vm.dirty_background_ratio", value: "5" }
    - { key: "vm.dirty_ratio", value: "10" }
    # --------------------------------------------------------
    # Network
    # --------------------------------------------------------
    - { key: "net.core.somaxconn", value: "4096" }
    - { key: "net.core.netdev_max_backlog", value: "4096" }
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "4096" }
    - { key: "net.ipv4.ip_local_port_range", value: "10240 65535" }
    # TCP keepalive
    - { key: "net.ipv4.tcp_keepalive_time", value: "600" }
    - { key: "net.ipv4.tcp_keepalive_intvl", value: "60" }
    - { key: "net.ipv4.tcp_keepalive_probes", value: "10" }
    # --------------------------------------------------------
    # Connection tracking
    # --------------------------------------------------------
    - { key: "net.netfilter.nf_conntrack_max", value: "65536" }
    # --------------------------------------------------------
    # File handles
    # --------------------------------------------------------
    - { key: "fs.file-max", value: "2097152" }
  when:
  - ansible_distribution == 'Ubuntu'
  - ansible_distribution_major_version == '22'
# ============================================================
# User / PAM file descriptor limits
# ============================================================
- name: Configure global soft nofile limit
  become: true
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    regexp: '^\*\s+soft\s+nofile\s+'
    line: '* soft nofile 2097152'
    create: true
    state: present

- name: Configure global hard nofile limit
  become: true
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    regexp: '^\*\s+hard\s+nofile\s+'
    line: '* hard nofile 2097152'
    create: true
    state: present

- name: Configure root soft nofile limit
  become: true
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    regexp: '^root\s+soft\s+nofile\s+'
    line: 'root soft nofile 2097152'
    create: true
    state: present

- name: Configure root hard nofile limit
  become: true
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    regexp: '^root\s+hard\s+nofile\s+'
    line: 'root hard nofile 2097152'
    create: true
    state: present

- name: Ensure pam_limits is enabled
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-session
    regexp: '^session\s+required\s+pam_limits\.so'
    line: 'session required pam_limits.so'
    create: true
    state: present
# ============================================================
# systemd default resource limits
# ============================================================
- name: Configure systemd default NOFILE limit
  become: true
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^#?DefaultLimitNOFILE='
    line: 'DefaultLimitNOFILE=2097152'
    create: true
    state: present

- name: Configure systemd default NPROC limit
  become: true
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^#?DefaultLimitNPROC='
    line: 'DefaultLimitNPROC=65536'
    create: true
    state: present

- name: Set timezone to Asia/Tehran
  timezone:
    name: Asia/Tehran
...
