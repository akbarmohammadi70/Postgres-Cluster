---
- name: Update and upgrade apt packages
  become: true
  apt:
    upgrade: yes
    update_cache: yes
    cache_valid_time: 86400
  ignore_errors: true

- name: Install required system packages
  apt:
    pkg:
      - curl 
      - ca-certificates 
      - iptables-persistent 
      - irqbalance
    state: present
  notify: Start irqbalance

- name: Set iptables rules
  iptables:
    table: "{{ item.table }}"
    chain: "{{ item.chain }}"
    protocol: "{{ item.protocol }}"
    destination_port: "{{ item.destination_port }}"
    action: "{{ item.action }}"
    jump: "{{ item.jump }}"
  with_items:
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '22',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'udp',
      destination_port: '53',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '5000',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '5001',
      action: 'insert',
      jump: 'ACCEPT'
    }
  - {
      table: 'filter',
      chain: 'INPUT',
      protocol: 'tcp',
      destination_port: '8080',
      action: 'insert',
      jump: 'ACCEPT'
    }

- name: Allow established connections
  iptables:
    table: filter
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    action: insert
    jump: ACCEPT

- name: Drop all other traffic
  iptables:
    table: filter
    chain: INPUT
    action: append
    jump: DROP

- name: Save iptables rules
  shell: iptables-save > /etc/iptables/rules.v4

# ============================================================
# irqbalance
# ============================================================
- name: Enable and start irqbalance
  become: true
  systemd:
    name: irqbalance
    state: started
    enabled: true
# ============================================================
# Kernel modules
# ============================================================
- name: Load nf_conntrack kernel module
  become: true
  modprobe:
    name: nf_conntrack
    state: present

- name: Ensure nf_conntrack loads at boot
  become: true
  lineinfile:
    path: /etc/modules
    regexp: '^nf_conntrack$'
    line: 'nf_conntrack'
    state: present
    create: true
# ============================================================
# Kernel / Network tuning
# ============================================================

- name: Configure kernel parameters for HAProxy
  become: true
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    # --------------------------------------------------------
    # Connection tracking
    # --------------------------------------------------------
    - { key: "net.netfilter.nf_conntrack_max", value: "262144" }
    - {
        key: "net.netfilter.nf_conntrack_tcp_timeout_time_wait",
        value: "30"
      }
    # --------------------------------------------------------
    # Network queues
    # --------------------------------------------------------
    - { key: "net.core.somaxconn", value: "4096" }
    - {
        key: "net.ipv4.tcp_max_syn_backlog",
        value: "8192"
      }
    - {
        key: "net.core.netdev_max_backlog",
        value: "4096"
      }
    # --------------------------------------------------------
    # TCP
    # --------------------------------------------------------
    - {
        key: "net.ipv4.tcp_fin_timeout",
        value: "15"
      }
    - {
        key: "net.ipv4.ip_local_port_range",
        value: "10240 65535"
      }
    - {
        key: "net.ipv4.tcp_keepalive_time",
        value: "600"
      }
    - {
        key: "net.ipv4.tcp_keepalive_intvl",
        value: "60"
      }
    - {
        key: "net.ipv4.tcp_keepalive_probes",
        value: "10"
      }

- name: Set timezone to Asia/Tehran
  timezone:
    name: Asia/Tehran
...
